name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Africa/Cairo

jobs:
  quality:
    name: typecheck · lint · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:unit

  integration:
    name: integration (postgres + RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_test
          TZ: Africa/Cairo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_TEST_URL: postgresql://school_app:app@localhost:5432/school_test
      DATABASE_TEST_OWNER_URL: postgresql://school_owner:owner@localhost:5432/school_test
      # Suites that reach src/shared/auth load src/shared/config/env.ts, which validates
      # the app's own variables at import. Locally they come from .env; CI has none, so
      # three files failed to load. Throwaway values, pointed at the test database.
      DATABASE_URL: postgresql://school_app:app@localhost:5432/school_test
      DATABASE_OWNER_URL: postgresql://school_owner:owner@localhost:5432/school_test
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      BETTER_AUTH_URL: http://localhost:3000
      LOOKUP_IP_SALT: ci-only-salt-at-least-16-chars
      PORTAL_PHONE_SALT: ci-only-phone-salt-at-least-16
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Mirrors docker/postgres/01-init.sh. The app role has NOBYPASSRLS so the
      # isolation suite tests the real policies, not a privileged shortcut.
      - name: Create roles and extensions
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d school_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE school_owner LOGIN PASSWORD 'owner' BYPASSRLS;
          CREATE ROLE school_app LOGIN PASSWORD 'app' NOBYPASSRLS NOCREATEDB NOCREATEROLE NOSUPERUSER;
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE EXTENSION IF NOT EXISTS btree_gist;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          GRANT ALL ON DATABASE school_test TO school_owner;
          ALTER SCHEMA public OWNER TO school_owner;
          GRANT CONNECT ON DATABASE school_test TO school_app;
          GRANT USAGE ON SCHEMA public TO school_app;
          SQL

      - name: Integration tests
        run: pnpm test:integration

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        # No production secrets in CI; env.ts validation is exercised by the tests.
        env:
          SKIP_ENV_VALIDATION: "1"
        run: pnpm build

  e2e:
    name: e2e (main only)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school
          TZ: Africa/Cairo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://school_app:app@localhost:5432/school
      DATABASE_OWNER_URL: postgresql://school_owner:owner@localhost:5432/school
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      BETTER_AUTH_URL: http://localhost:3000
      LOOKUP_IP_SALT: ci-only-salt-at-least-16-chars
      PORTAL_PHONE_SALT: ci-only-phone-salt-at-least-16
      # The whole suite runs from one address; a per-IP budget meant for the internet
      # would block it against itself. Never set outside CI and local test runs.
      DISABLE_RATE_LIMIT: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Mirrors docker/postgres/01-init.sh. The app role is NOBYPASSRLS here too, so
      # the e2e run exercises the real policies rather than a privileged shortcut.
      - name: Create roles and extensions
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d school -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE school_owner LOGIN PASSWORD 'owner' BYPASSRLS;
          CREATE ROLE school_app LOGIN PASSWORD 'app' NOBYPASSRLS NOCREATEDB NOCREATEROLE NOSUPERUSER;
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE EXTENSION IF NOT EXISTS btree_gist;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          GRANT ALL ON DATABASE school TO school_owner;
          ALTER SCHEMA public OWNER TO school_owner;
          GRANT CONNECT ON DATABASE school TO school_app;
          GRANT USAGE ON SCHEMA public TO school_app;
          SQL

      - name: Migrate and seed
        run: |
          pnpm db:migrate
          pnpm db:seed

      - run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
